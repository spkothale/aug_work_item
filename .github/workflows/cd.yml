name: Calculator CD

on:
  workflow_run:
    workflows:
      - Calculator CI
    types:
      - completed

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Login to GHCR
      # ============================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. Identify current version
      # ============================================================
      - name: Show deployment version
        run: |
          echo "======================================"
          echo "Current deployment version"
          echo "======================================"
          echo "${{ github.event.workflow_run.head_sha }}"
          echo "======================================"

      # ============================================================
      # 3. Pull last known-good image
      # ============================================================
      - name: Pull known-good image
        run: |
          echo "======================================"
          echo "Checking for known-good image"
          echo "======================================"

          if docker pull \
            ghcr.io/${{ github.repository }}:known-good; then

            echo "Known-good image found"
            echo "KNOWN_GOOD_EXISTS=true" >> "$GITHUB_ENV"

          else

            echo "No known-good image exists yet"
            echo "This may be the first deployment"
            echo "KNOWN_GOOD_EXISTS=false" >> "$GITHUB_ENV"

          fi

      # ============================================================
      # 4. Pull current image
      # ============================================================
      - name: Pull current image
        run: |
          echo "======================================"
          echo "Pulling current image"
          echo "======================================"

          docker pull \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

      # ============================================================
      # 5. Deploy current version
      # ============================================================
      - name: Deploy current version
        run: |
          echo "======================================"
          echo "Deploying current version"
          echo "======================================"

          docker rm -f calculator-api 2>/dev/null || true

          docker run -d \
            --name calculator-api \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

      # ============================================================
      # 6. Verify current deployment
      # ============================================================
      - name: Verify current deployment
        id: verify
        continue-on-error: true
        run: |

          echo "======================================"
          echo "Waiting for API"
          echo "======================================"

          healthy=false

          for i in {1..15}; do

            echo "Deployment verification attempt $i/15"
            echo "======================================"

            response=$(curl \
              --fail \
              --silent \
              http://localhost:8080/health || true)

            echo "Health response:"
            echo "$response"

            if [ "$response" = '{"status":"healthy"}' ]; then
              echo "Application is healthy"
              healthy=true
              break
            fi

            echo "Application not healthy yet..."
            sleep 2

          done

          if [ "$healthy" != "true" ]; then

            echo "======================================"
            echo "CURRENT DEPLOYMENT FAILED"
            echo "======================================"

            echo "===== Container status ====="
            docker ps -a

            echo "===== Container logs ====="
            docker logs calculator-api || true

            echo "===== Container inspect ====="
            docker inspect calculator-api \
              --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}' \
              || true

            exit 1
          fi

          # --------------------------------------------------------
          # Smoke test
          # --------------------------------------------------------

          echo "======================================"
          echo "Running deployment smoke test"
          echo "======================================"

          smoke_response=$(curl \
            --fail \
            --silent \
            "http://localhost:8080/calculate?expression=2%2B3%2A4" \
            || true)

          echo "Smoke test response:"
          echo "$smoke_response"

          if [ "$smoke_response" != '{"result":14.0}' ]; then

            echo "======================================"
            echo "SMOKE TEST FAILED"
            echo "======================================"

            docker logs calculator-api || true

            exit 1
          fi

          echo "======================================"
          echo "CURRENT DEPLOYMENT VERIFIED"
          echo "======================================"

      # ============================================================
      # 7. Deployment successful
      # ============================================================
      - name: Deployment successful
        if: steps.verify.outcome == 'success'
        run: |
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Running version:"
          echo "${{ github.event.workflow_run.head_sha }}"
          echo "======================================"

      # ============================================================
      # 8. Update known-good
      #
      # IMPORTANT:
      # This happens ONLY after deployment verification succeeds.
      # ============================================================
      - name: Update known-good image
        if: steps.verify.outcome == 'success'
        run: |

          echo "======================================"
          echo "Updating known-good image"
          echo "======================================"

          docker pull \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

          docker tag \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }} \
            ghcr.io/${{ github.repository }}:known-good

          docker push \
            ghcr.io/${{ github.repository }}:known-good

          echo "======================================"
          echo "known-good UPDATED"
          echo "======================================"
          echo "known-good now points to:"
          echo "${{ github.event.workflow_run.head_sha }}"
          echo "======================================"

      # ============================================================
      # 9. Stop failed deployment
      # ============================================================
      - name: Stop failed deployment
        if: steps.verify.outcome == 'failure'
        run: |

          echo "======================================"
          echo "Stopping unhealthy deployment"
          echo "======================================"

          docker rm -f calculator-api || true

      # ============================================================
      # 10. Rollback to known-good
      #
      # Only possible if known-good already exists.
      # ============================================================
      - name: Deploy known-good version
        if: steps.verify.outcome == 'failure' && env.KNOWN_GOOD_EXISTS == 'true'
        run: |

          echo "======================================"
          echo "ROLLBACK STARTED"
          echo "======================================"
          echo "Deploying last known-good version"
          echo "======================================"

          docker run -d \
            --name calculator-api \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:known-good

      # ============================================================
      # 11. Rollback verification
      # ============================================================
      - name: Verify rollback
        if: steps.verify.outcome == 'failure' && env.KNOWN_GOOD_EXISTS == 'true'
        run: |

          rollback_healthy=false

          for i in {1..15}; do

            echo "Rollback verification attempt $i/15"
            echo "======================================"

            response=$(curl \
              --fail \
              --silent \
              http://localhost:8080/health || true)

            echo "Health response:"
            echo "$response"

            if [ "$response" = '{"status":"healthy"}' ]; then

              echo "Rollback health check passed"
              rollback_healthy=true
              break

            fi

            echo "Rollback not healthy yet..."
            sleep 2

          done

          if [ "$rollback_healthy" != "true" ]; then

            echo "======================================"
            echo "ROLLBACK FAILED"
            echo "======================================"

            echo "===== Container status ====="
            docker ps -a

            echo "===== Container logs ====="
            docker logs calculator-api || true

            echo "===== Container inspect ====="
            docker inspect calculator-api \
              --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}' \
              || true

            exit 1
          fi

      # ============================================================
      # 12. Rollback smoke test
      # ============================================================
      - name: Rollback smoke test
        if: steps.verify.outcome == 'failure' && env.KNOWN_GOOD_EXISTS == 'true'
        run: |

          echo "======================================"
          echo "Running rollback smoke test"
          echo "======================================"

          response=$(curl \
            --fail \
            --silent \
            "http://localhost:8080/calculate?expression=2%2B3%2A4" \
            || true)

          echo "Rollback response:"
          echo "$response"

          if [ "$response" != '{"result":14.0}' ]; then

            echo "======================================"
            echo "ROLLBACK SMOKE TEST FAILED"
            echo "======================================"

            docker logs calculator-api || true

            exit 1
          fi

          echo "======================================"
          echo "ROLLBACK SUCCESSFUL"
          echo "======================================"

      # ============================================================
      # 13. No rollback target available
      #
      # This happens only if the first deployment fails.
      # ============================================================
      - name: No rollback target
        if: steps.verify.outcome == 'failure' && env.KNOWN_GOOD_EXISTS != 'true'
        run: |

          echo "======================================"
          echo "DEPLOYMENT FAILED"
          echo "======================================"

          echo "No known-good image exists."
          echo "Rollback is not possible because this is"
          echo "the first deployment or no healthy deployment"
          echo "has been recorded yet."

          exit 1

      # ============================================================
      # 14. Cleanup
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up container..."
          docker rm -f calculator-api 2>/dev/null || true
