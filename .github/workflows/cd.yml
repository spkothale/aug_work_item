name: Calculator CD

on:
  workflow_run:
    workflows:
      - Calculator CI
    types:
      - completed

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Login to GHCR
      # ==================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # 2. Find previous successful CI version
      # ==================================================
      - name: Find previous successful version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Current deployment SHA:"
          echo "$CURRENT_SHA"

          echo "Searching for previous successful CI run..."

          PREVIOUS_SHA=$(
            gh api \
              "repos/$REPOSITORY/actions/workflows/ci.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[]
                | select(.head_sha != env.CURRENT_SHA)
                | .head_sha' |
            head -n 1
          )

          echo "Previous SHA:"
          echo "$PREVIOUS_SHA"

          if [ -z "$PREVIOUS_SHA" ]; then
            echo "ERROR: No previous successful CI version found."
            exit 1
          fi

          echo "Previous known-good version:"
          echo "$PREVIOUS_SHA"

          echo "PREVIOUS_SHA=$PREVIOUS_SHA" >> "$GITHUB_ENV"

      # ==================================================
      # 3. Pull current image
      # ==================================================
      - name: Pull current image
        run: |
          docker pull \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

      # ==================================================
      # 4. Pull previous known-good image
      # ==================================================
      - name: Pull previous known-good image
        run: |
          docker pull \
            ghcr.io/${{ github.repository }}:${PREVIOUS_SHA}

      # ==================================================
      # 5. Deploy current version
      # ==================================================
      - name: Deploy current version
        run: |
          docker run -d \
            --name calculator-api \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

          sleep 2

          echo "===== Current container status ====="
          docker ps -a

      # ==================================================
      # 6. Verify current deployment
      # ==================================================
      - name: Verify current deployment
        id: verify
        continue-on-error: true
        run: |
          for i in {1..15}; do

            echo "======================================"
            echo "Current deployment verification attempt $i/15"
            echo "======================================"

            response=$(curl \
              --silent \
              --show-error \
              --write-out "|||HTTP_STATUS:%{http_code}" \
              http://localhost:8080/health || true)

            HTTP_CODE="${response##*|||HTTP_STATUS:}"
            BODY="${response%|||HTTP_STATUS:*}"

            echo "HTTP status: $HTTP_CODE"
            echo "Health response: [$BODY]"

            if [ "$HTTP_CODE" = "200" ]; then

              STATUS=$(echo "$BODY" | jq -r '.status' 2>/dev/null || true)

              echo "Parsed status: [$STATUS]"

              if [ "$STATUS" = "healthy" ]; then
                echo "Current deployment is healthy"
                exit 0
              fi

            fi

            echo "Application not healthy yet..."

            if [ "$i" = "1" ] || [ "$i" = "5" ] || [ "$i" = "10" ]; then
              echo "===== Current container status ====="
              docker ps -a

              echo "===== Current container logs ====="
              docker logs calculator-api || true
            fi

            sleep 2

          done

          echo "======================================"
          echo "CURRENT DEPLOYMENT FAILED"
          echo "======================================"

          echo "===== Container status ====="
          docker ps -a

          echo "===== Container logs ====="
          docker logs calculator-api || true

          exit 1

      # ==================================================
      # 7. Deployment successful
      # ==================================================
      - name: Deployment successful
        if: steps.verify.outcome == 'success'
        run: |
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "Running version:"
          echo "${{ github.event.workflow_run.head_sha }}"

      # ==================================================
      # 8. Stop failed deployment
      # ==================================================
      - name: Stop failed deployment
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Stopping unhealthy deployment..."

          docker rm -f calculator-api || true

      # ==================================================
      # 9. Deploy previous known-good version
      # ==================================================
      - name: Deploy previous known-good version
        if: steps.verify.outcome == 'failure'
        run: |
          echo "======================================"
          echo "ROLLBACK STARTED"
          echo "======================================"

          echo "Rolling back to:"
          echo "$PREVIOUS_SHA"

          docker run -d \
            --name calculator-api \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:${PREVIOUS_SHA}

          sleep 2

          echo "===== Rollback container status ====="
          docker ps -a

      # ==================================================
      # 10. Verify rollback
      # ==================================================
      - name: Verify rollback
        if: steps.verify.outcome == 'failure'
        run: |
          for i in {1..15}; do

            echo "======================================"
            echo "Rollback verification attempt $i/15"
            echo "======================================"

            response=$(curl \
              --silent \
              --show-error \
              --write-out "|||HTTP_STATUS:%{http_code}" \
              http://localhost:8080/health || true)

            HTTP_CODE="${response##*|||HTTP_STATUS:}"
            BODY="${response%|||HTTP_STATUS:*}"

            echo "HTTP status: $HTTP_CODE"
            echo "Health response: [$BODY]"

            if [ "$HTTP_CODE" = "200" ]; then

              STATUS=$(echo "$BODY" | jq -r '.status' 2>/dev/null || true)

              echo "Parsed rollback status: [$STATUS]"

              if [ "$STATUS" = "healthy" ]; then
                echo "======================================"
                echo "ROLLBACK SUCCESSFUL"
                echo "======================================"

                exit 0
              fi

            fi

            echo "Rollback not healthy yet..."

            if [ "$i" = "1" ] || [ "$i" = "5" ] || [ "$i" = "10" ]; then

              echo "===== Rollback container status ====="
              docker ps -a

              echo "===== Rollback container logs ====="
              docker logs calculator-api || true

            fi

            sleep 2

          done

          echo "======================================"
          echo "ROLLBACK FAILED"
          echo "======================================"

          echo "===== Container status ====="
          docker ps -a

          echo "===== Container logs ====="
          docker logs calculator-api || true

          echo "===== Container inspect ====="
          docker inspect calculator-api \
            --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}' || true

          exit 1

      # ==================================================
      # 11. Rollback smoke test
      # ==================================================
      - name: Rollback smoke test
        if: steps.verify.outcome == 'failure'
        run: |
          echo "======================================"
          echo "ROLLBACK SMOKE TEST"
          echo "======================================"

          response=$(curl \
            --silent \
            --show-error \
            "http://localhost:8080/calculate?expression=2%2B3%2A4")

          echo "Calculator response:"
          echo "$response"

          test "$response" = '{"result":14.0}'

          echo "Rollback smoke test passed"

      # ==================================================
      # 12. Cleanup
      # ==================================================
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up container..."

          docker rm -f calculator-api || true
