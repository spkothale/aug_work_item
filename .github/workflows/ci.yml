      - name: Start Docker container
        run: |
          docker run -d \
            --name calculator-api \
            -p 8080:8080 \
            calculator:${{ github.sha }}

      - name: Check container status
        run: |
          docker ps -a
          echo "===== Container logs ====="
          docker logs calculator-api

      - name: Wait for API
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API... attempt $i/15"
            sleep 2
          done

          echo "API failed to become ready"
          echo "===== Container logs ====="
          docker logs calculator-api
          exit 1

      - name: API smoke test
        run: |
          output=$(curl --fail --silent \
            "http://localhost:8080/calculate?expression=2%2B3%2A4")

          echo "Response: $output"

          test "$output" = '{"result":14.0}'

      - name: Stop Docker container
        if: always()
        run: docker rm -f calculator-api
