name: Calculator CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Python
        run: python --version

      - name: Run calculator tests
        run: python -m unittest discover -s tests

      - name: Run Ruff lint
        uses: astral-sh/ruff-action@v3

      - name: Build Docker image
        run: docker build -t calculator:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name calculator-api \
            -p 8080:8080 \
            calculator:${{ github.sha }}

      - name: Check container is running
        run: docker ps

      - name: Health check
        run: |
          sleep 2
          curl --fail http://localhost:8080/health

      - name: API smoke test
        run: |
          response=$(curl --fail \
            "http://localhost:8080/calculate?expression=2%2B3%2A4")

          echo "Response: $response"

          test "$response" = '{"result":14.0}'

      - name: Stop Docker container
        if: always()
        run: docker rm -f calculator-api      

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag calculator:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository }}:${{ github.sha }}


